  <style id="pl-css">
html.pl-lock{overflow:hidden}
.pl{position:fixed;inset:0;z-index:9999;background:#0A1530;color:#FFFFFF;display:flex;align-items:center;justify-content:center;transition:transform .85s cubic-bezier(.76,0,.24,1),border-radius .85s cubic-bezier(.76,0,.24,1)}
.pl.out{transform:translateY(-100%);border-radius:0 0 50% 50%/0 0 12vh 12vh}
.pl.gone{display:none}
.pl-in{display:flex;flex-direction:column;align-items:center;gap:26px;transition:opacity .4s,transform .6s cubic-bezier(.76,0,.24,1)}
.pl.out .pl-in{opacity:0;transform:translateY(-40px)}
.pl-name{display:flex;align-items:baseline;gap:.28em;font-family:'Inter Tight','Inter',system-ui,sans-serif;font-size:clamp(34px,5vw,56px);letter-spacing:-.03em;line-height:1.15;white-space:nowrap}
.pl-name .w{display:flex;overflow:hidden;padding-bottom:.08em}
.pl-name .c{display:inline-block;transform:translateY(110%);animation:plUp .8s cubic-bezier(.22,1,.36,1) forwards}
.pl-name .acc{font-family:inherit;font-style:normal;color:#C8F169}
.pl-bar{width:140px;height:1px;background:rgba(255,255,255,.14);overflow:hidden}
.pl-bar i{display:block;height:100%;background:#C8F169;transform:scaleX(0);transform-origin:left;transition:transform .12s linear}
.pl-num{position:absolute;right:28px;bottom:24px;font-family:'Inter',sans-serif;font-size:13px;letter-spacing:.14em;opacity:.55;font-variant-numeric:tabular-nums}
@keyframes plUp{to{transform:none}}
@media(prefers-reduced-motion:reduce){.pl{display:none}}
.pl-name{font-weight:600}</style>
</head>
  <body>
<div class="pl" id="pl" aria-hidden="true"><div class="pl-in"><div class="pl-name" id="plName"><span class="w">Falvella</span><span class="w acc">Contabilidade</span></div><div class="pl-bar"><i id="plBar"></i></div></div><span class="pl-num" id="plNum">000</span></div>
<script>
(function(){var pl=document.getElementById('pl');if(!pl)return;var de=document.documentElement;
if(matchMedia('(prefers-reduced-motion: reduce)').matches){pl.classList.add('gone');addEventListener('DOMContentLoaded',function(){document.body.classList.add('ready')});return}
de.classList.add('pl-lock');var k=0;document.querySelectorAll('#plName .w').forEach(function(w){var t=w.textContent;w.textContent='';t.split('').forEach(function(ch){var s=document.createElement('span');s.className='c';s.textContent=ch===' '?'\u00a0':ch;s.style.animationDelay=Math.min(k++*28,420)+'ms';w.appendChild(s)})});
var bar=document.getElementById('plBar'),num=document.getElementById('plNum'),t0=performance.now(),D=1000;
(function tick(t){var p=Math.min(1,(t-t0)/D),e=1-Math.pow(1-p,3);bar.style.transform='scaleX('+e+')';num.textContent=String(Math.round(e*100)).padStart(3,'0');
if(p<1)return requestAnimationFrame(tick);
var go=function(){pl.classList.add('out');de.classList.remove('pl-lock');setTimeout(function(){document.body.classList.add('ready')},150);setTimeout(function(){pl.classList.add('gone')},950)};
document.readyState==='loading'?addEventListener('DOMContentLoaded',go):go();})(t0);
})();
</script>
    <div id="root"></div>
  </body>
